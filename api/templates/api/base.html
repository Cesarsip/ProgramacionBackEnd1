<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechNova &middot; Backend & DRF{% endblock %}</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS (Para sistema de grillas y modales) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        /* ================================================================
           PALETA (Tema Dark + Rosa / Magenta)
           ================================================================ */
        :root {
            --bg-base:      #0d0d10;   /* fondo principal casi negro */
            --bg-panel:     #17171c;   /* paneles / cards */
            --bg-panel-2:   #22222a;   /* paneles secundarios / inputs */
            --border:       #2c2c36;   /* bordes sutiles */

            --pink:         #ED2C7B;   /* rosa/magenta principal */
            --pink-hover:   #FF3D8C;   /* rosa mas claro para hover */
            --pink-deep:    #B01560;   /* rosa oscuro para presionado */
            --pink-glow:    rgba(237, 44, 123, 0.35);

            --purple:       #6E2CB8;   /* acento morado secundario */
            --red:          #C0392B;   /* acento rojo (alerta / danger) */
            --green:        #10B981;   /* acento verde */

            --text:         #F5F5F7;
            --text-muted:   #9a9aa8;

            --radius:       6px;
            --radius-lg:    12px;
            --font-body:    'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-display: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        /* ================================================================
           BASE
           ================================================================ */
        * { box-sizing: border-box; }

        html, body { 
            min-height: 100vh; 
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-base);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(circle at 85% -10%, var(--pink-glow), transparent 45%),
                radial-gradient(circle at 15% 100%, rgba(110, 44, 184, 0.18), transparent 40%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 24px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        a { color: var(--pink); text-decoration: none; transition: color 0.15s ease; }
        a:hover { color: var(--pink-hover); }

        /* ================================================================
           HEADER
           ================================================================ */
        .site-header {
            border-top: 3px solid var(--pink);
            background: rgba(13, 13, 16, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: var(--text);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
        }
        .logo:hover {
            color: var(--text);
        }
        .logo-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pink);
            margin-right: 8px;
            box-shadow: 0 0 12px var(--pink-glow);
        }

        .main-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .main-nav a {
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: var(--radius);
            font-size: 0.92rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }
        .main-nav a:hover {
            color: var(--text);
            background: var(--bg-panel);
        }
        .main-nav a.active {
            color: var(--text);
            background: var(--pink);
            box-shadow: 0 2px 10px var(--pink-glow);
        }

        /* ================================================================
           BOTONES
           ================================================================ */
        .btn-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1;
            padding: 12px 20px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            background: var(--bg-panel-2);
            color: var(--text);
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.08s, background 0.15s, box-shadow 0.15s,
                        border-color 0.15s, color 0.15s;
            user-select: none;
        }
        .btn-custom:hover { background: #2f2f38; color: var(--text); }
        .btn-custom:active { transform: translateY(1px); }

        .btn-custom-primary {
            background: var(--pink);
            color: #fff !important;
            box-shadow: 0 4px 16px -4px var(--pink-glow);
        }
        .btn-custom-primary:hover {
            background: var(--pink-hover);
            box-shadow: 0 6px 20px -4px var(--pink-glow);
            color: #fff !important;
        }
        .btn-custom-primary:active { background: var(--pink-deep); }

        .btn-custom-outline {
            background: transparent;
            color: var(--pink) !important;
            border-color: var(--pink);
        }
        .btn-custom-outline:hover {
            background: var(--pink);
            color: #fff !important;
        }

        .btn-custom-ghost {
            background: transparent;
            color: var(--text-muted);
        }
        .btn-custom-ghost:hover {
            background: var(--bg-panel);
            color: var(--text);
        }

        .btn-custom-danger {
            background: var(--red);
            color: #fff !important;
        }
        .btn-custom-danger:hover { background: #d94537; }

        .btn-custom-sm {
            font-size: 0.82rem;
            padding: 8px 14px;
        }
        .btn-custom-lg {
            font-size: 1.05rem;
            padding: 14px 28px;
        }
        .btn-custom-pill { border-radius: 999px; }
        .btn-custom-block { display: flex; width: 100%; }

        /* ================================================================
           CARDS & PANELES
           ================================================================ */
        .card-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .card-panel:hover {
            border-color: var(--pink);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -6px var(--pink-glow);
        }

        .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--pink);
            background: rgba(237, 44, 123, 0.12);
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 14px;
        }

        /* ================================================================
           FORMULARIOS
           ================================================================ */
        .form-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }
        .form-field label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-field input,
        .form-field textarea,
        .form-field select,
        .form-control,
        .form-select {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 11px 14px;
            background: var(--bg-panel-2) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus,
        .form-control:focus,
        .form-select:focus {
            outline: none !important;
            border-color: var(--pink) !important;
            box-shadow: 0 0 0 3px var(--pink-glow) !important;
        }

        /* ================================================================
           TABLAS
           ================================================================ */
        .table-custom {
            width: 100%;
            color: var(--text);
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-custom th {
            background: var(--bg-panel-2);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .table-custom td {
            background: var(--bg-panel);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
            vertical-align: middle;
        }
        .table-custom tr:hover td {
            background: #1c1c24;
        }

        /* ================================================================
           BADGES
           ================================================================ */
        .badge-custom {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--bg-panel-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge-pink {
            background: rgba(237, 44, 123, 0.15);
            color: var(--pink-hover);
            border-color: rgba(237, 44, 123, 0.4);
        }
        .badge-purple {
            background: rgba(110, 44, 184, 0.2);
            color: #b785f6;
            border-color: rgba(110, 44, 184, 0.4);
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* ================================================================
           MODALES (Bootstrap Override para Dark Theme)
           ================================================================ */
        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--pink-glow);
        }
        .modal-header {
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
        }
        .modal-footer {
            border-top: 1px solid var(--border);
            padding: 16px 24px;
        }

        /* ================================================================
           FOOTER
           ================================================================ */
        .site-footer {
            border-top: 1px solid var(--border);
            padding: 30px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-top: auto;
            background: var(--bg-base);
        }

        .accent-gradient {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="site-header">
        <div class="container header-wrapper">
            <a href="{% url 'index' %}" class="logo">
                <span class="logo-dot"></span>TechNova<span style="color: var(--pink);">Solutions</span>
            </a>
            
            <nav class="main-nav">
                <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'inicio' %}active{% endif %}">
                    <i class="bi bi-house-door me-1"></i> Inicio
                </a>
                <a href="{% url 'programmers' %}" class="{% if request.resolver_match.url_name == 'programmers' %}active{% endif %}">
                    <i class="bi bi-code-slash me-1"></i> Programadores (CRUD)
                </a>
                <a href="{% url 'services' %}" class="{% if request.resolver_match.url_name == 'services' %}active{% endif %}">
                    <i class="bi bi-layers-fill me-1"></i> Servicios
                </a>
                <a href="{% url 'contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">
                    <i class="bi bi-envelope-fill me-1"></i> Contacto
                </a>
                <a href="{% url 'login' %}" class="{% if request.resolver_match.url_name == 'login' %}active{% endif %}">
                    <i class="bi bi-person-lock me-1"></i> Login
                </a>
            </nav>

            <div class="d-flex align-items-center gap-2">
                <a href="/api/programmers/" target="_blank" class="btn-custom btn-custom-outline btn-custom-sm btn-custom-pill" title="Ver Endpoint DRF nativo">
                    <i class="bi bi-braces"></i> API REST
                </a>
                <a href="/admin/" target="_blank" class="btn-custom btn-custom-sm btn-custom-pill" title="Panel de Administración">
                    <i class="bi bi-shield-lock"></i> Admin
                </a>
            </div>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Token CSRF Global de Seguridad -->
    {% csrf_token %}

    <!-- ========== FOOTER ========== -->
    <footer class="site-footer">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <strong>TechNova Solutions</strong> &middot; Backend & DRF &middot; Paleta Dark/Rosa
                </div>
                <div>
                    <span class="badge-custom badge-pink">
                        <i class="bi bi-mortarboard-fill me-1"></i> INACAP - Informática y Ciberseguridad
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
