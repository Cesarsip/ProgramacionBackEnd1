{% extends "academic/base.html" %}

{% block title %}Iniciar sesión · Sistema Académico{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge-custom badge-pink mb-3">
                        <i class="bi bi-shield-lock-fill me-1"></i> ACCESO SEGURO
                    </span>
                    <h1 class="h2 mb-2">Iniciar sesión</h1>
                    <p class="text-muted mb-0">Accede al sistema de gestión académica.</p>
                </div>

                <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <input class="form-control" id="username" name="username"
                               autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control" id="password" name="password"
                               type="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn-custom btn-custom-primary btn-custom-block" id="login-button"
                            type="submit">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('login-button');
        const error = document.getElementById('login-error');
        error.classList.add('d-none');
        button.disabled = true;

        try {
            const response = await fetch('/api/token/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || 'Usuario o contraseña incorrectos.');
            }
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            window.location.href = '/';
        } catch (loginError) {
            error.textContent = loginError.message;
            error.classList.remove('d-none');
        } finally {
            button.disabled = false;
        }
    });
</script>
{% endblock %}
